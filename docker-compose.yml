services:
  tagbox:
    build: .
    image: tagbox:latest
    container_name: tagbox
    restart: unless-stopped
    ports:
      - "8420:8000"
    volumes:
      - ./data:/data:Z
      # One folder containing all your libraries as subfolders (e.g.
      # /path/to/your/media/Music, /path/to/your/media/Video Game Music).
      # Add each one as a library from within the app — see the README.
      - /path/to/your/media:/media:rw,Z
